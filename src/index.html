<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Screenplay Cards</title>
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;color:#1a1a18;height:100vh;overflow:hidden;display:flex;flex-direction:column;padding:0 1.5rem}
.pbar{display:flex;flex-direction:column;gap:0;margin-bottom:12px;flex-shrink:0}
.proj-row{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;padding-left:56px;margin-bottom:8px;border-bottom:0.5px solid #d3d1c7;gap:12px;min-height:28px;flex-wrap:wrap}
.proj-name{font-size:13px;font-weight:600;color:#1a1a18;letter-spacing:-0.01em;white-space:nowrap}
.proj-name.unsaved{color:#888780;font-style:italic}
.proj-center{display:flex;flex-direction:column;align-items:flex-start;flex-shrink:0}
.proj-lastsaved{font-size:10px;color:#b4b2a9;margin-top:1px;white-space:nowrap}
.proj-writer-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
.proj-writer-lbl{font-size:11px;color:#888780;white-space:nowrap}
.proj-writer-inp{font-size:12px;color:#1a1a18;border:none;border-bottom:0.5px solid transparent;background:transparent;font-family:inherit;padding:1px 2px;min-width:120px;max-width:220px;outline:none;-webkit-app-region:no-drag}
.proj-writer-inp:focus{border-bottom-color:#b4b2a9}
.proj-writer-inp::placeholder{color:#b4b2a9}
.board-row{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.ptab{font-size:12px;padding:4px 8px;border:0.5px solid #d3d1c7;border-radius:8px;background:transparent;color:#5f5e5a;cursor:pointer;display:flex;align-items:center;gap:5px;-webkit-app-region:no-drag}
.ptab:hover{background:#ece9e3}
.ptab.active{background:#fff;color:#1a1a18;border-color:#b4b2a9;font-weight:500}
.ptab-name{outline:none;cursor:inherit;min-width:30px}
.ptab-x{font-size:10px;color:#b4b2a9;cursor:pointer;line-height:1}
.ptab-x:hover{color:#a32d2d}
.padd{font-size:12px;padding:4px 10px;border:0.5px solid #d3d1c7;border-radius:8px;background:transparent;color:#b4b2a9;cursor:pointer;-webkit-app-region:no-drag}
.padd:hover{background:#ece9e3;color:#1a1a18}
.tbar{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap;-webkit-app-region:drag}
  .tbar-sep{width:1px;height:18px;background:#d3d1c7;flex-shrink:0;margin:0 2px}
  .tbtn-panel{background:#f1efe8;border-color:#c9c7bf}
  .tbtn-panel.tbtn-on{background:#d4e8f7;border-color:#7ab8e8}
button{font-family:inherit;font-size:13px;padding:5px 12px;border:0.5px solid #b4b2a9;border-radius:8px;background:#fff;color:#1a1a18;cursor:pointer;-webkit-app-region:no-drag}
button:hover{background:#f1efe8}
.vtog{display:flex;border:0.5px solid #b4b2a9;border-radius:8px;overflow:hidden}
.vtog button{border:none;border-radius:0;padding:5px 12px;font-size:12px;background:transparent}
.vtog button.on{background:#e8e6e0}
.tbtn-on{background:#e8e6e0!important;font-weight:500}
.astrip{margin-bottom:10px;padding:8px 12px;border:0.5px solid #b4b2a9;border-radius:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#ece9e3}
.actbtn{font-size:12px;padding:4px 10px;border:0.5px solid #b4b2a9;border-radius:20px;background:transparent;color:#5f5e5a;cursor:pointer;font-family:inherit}
.actbtn:hover{background:#ece9e3;color:#1a1a18}
.actbtn.on{background:#1a1a18;color:#f5f4f0;border-color:#1a1a18}
.astrip.warn{background:#fcebeb;border-color:#f09595}
.astrip button{font-size:12px;padding:3px 10px}
.astrip button.dbtn{background:#fcebeb;color:#a32d2d;border-color:#f09595}
.astrip button.dbtn:hover{background:#f7c1c1}
.sl{font-size:13px;color:#1a1a18;flex-shrink:0}
.sl.d{color:#a32d2d}
.csw{width:18px;height:18px;border-radius:50%;cursor:pointer;flex-shrink:0;display:inline-block;border:1.5px solid transparent;transition:transform 0.1s}
.csw:hover{transform:scale(1.2)}
.ctr{font-size:12px;color:#888780;margin-left:auto;align-self:center}
.sdot{width:6px;height:6px;border-radius:50%;background:#3b6d11;display:inline-block;margin-right:4px;opacity:0;transition:opacity 0.3s}
.sdot.on{opacity:1}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));grid-auto-rows:160px;gap:12px;align-items:start}
.clist{display:flex;flex-direction:column;gap:8px}
.cwrap{perspective:900px;height:160px;cursor:grab;user-select:none}
.cwrap.dragging{opacity:0.4}
.cwrap.drag-over{outline:2px solid #378add}
.color-bar{position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:12px 0 0 12px;display:flex;flex-direction:column;overflow:hidden;z-index:1}
.ci{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 0.4s ease}
.cwrap.flipped .ci{transform:rotateY(180deg)}
.cf{position:absolute;top:0;left:0;width:100%;height:100%;backface-visibility:hidden;background:#fff;border:0.5px solid #d3d1c7;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;overflow:hidden}
.cf.bk{transform:rotateY(180deg);background:#f5f4f0}
.sn{font-size:11px;color:#888780;font-weight:500;letter-spacing:0.05em;margin-bottom:3px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center}
.cdot{width:9px;height:9px;border-radius:50%;cursor:pointer;background:#e8e6e0;border:1px solid #b4b2a9;flex-shrink:0;display:inline-block}
.fsdot{display:flex;align-items:center;gap:0px;border-radius:5px;overflow:hidden;flex-shrink:0;height:16px;cursor:default;user-select:none}
.fsdot-btn{width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;color:#888780;background:rgba(0,0,0,0.05);border:none;padding:0;font-family:inherit;line-height:1}
.fsdot-btn:hover{background:rgba(0,0,0,0.12);color:#1a1a18}
.fsdot-num{font-size:10px;color:#888780;padding:0 3px;line-height:16px;min-width:18px;text-align:center}
.cdot:hover{transform:scale(1.3)}
.st{font-weight:500;color:#1a1a18;flex:1;word-break:break-word;line-height:1.35;outline:none;overflow:hidden;user-select:text;cursor:text;caret-color:currentColor}
.cf .st{display:flex;align-items:center;justify-content:center;text-align:center;}
.sntog{cursor:pointer;border-radius:4px;padding:0 2px;margin:-0 -2px;transition:opacity 0.15s}
.sntog:hover{opacity:0.6}
.sntog.excluded{opacity:0.35;text-decoration:line-through;letter-spacing:0}
.st:focus{border-bottom:1px solid #b4b2a9}
.st:empty::before{content:'untitled';color:#b4b2a9;font-style:italic;font-weight:400;pointer-events:none}
.bl{font-size:10px;color:#888780;letter-spacing:0.05em;margin-bottom:3px;flex-shrink:0}
.bn{font-size:12px;color:#5f5e5a;flex:1;overflow-y:auto;word-break:break-word;line-height:1.6;outline:none;user-select:text;cursor:text;caret-color:currentColor}
.bn:empty::before{content:'notes…';color:#b4b2a9;font-style:italic;pointer-events:none}
.bn:focus{border-bottom:1px solid #b4b2a9}

.ca{display:flex;gap:3px;align-items:center;margin-top:5px;flex-shrink:0;opacity:0;transition:opacity 0.15s}
.cwrap:hover .ca{opacity:1}
.ca button{font-size:11px;padding:2px 6px;background:transparent;color:#888780;user-select:none}
.ca button:hover{background:#f1efe8;color:#1a1a18}
.ca button.xb:hover{background:#fcebeb;color:#a32d2d;border-color:#f09595}
.ca .spacer{flex:1}
.lrow{display:flex;gap:12px;align-items:stretch;cursor:grab;user-select:none}
.lrow.dragging{opacity:0.4}
.lrow.drag-over{outline:2px solid #378add}
.lnum{font-size:12px;color:#888780;width:28px;padding-top:14px;flex-shrink:0;text-align:right;font-weight:500}
.lf{background:#fff;border:0.5px solid #d3d1c7;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;min-height:60px;flex:1;position:relative;overflow:hidden}
.lf.bk{background:#f5f4f0;flex:1.5}
@media(prefers-color-scheme:dark){
  body{background:#1c1c1a;color:#e8e6e0}
  button{background:#2c2c2a;color:#e8e6e0;border-color:#444441}
  .tbtn-panel{background:#3a3a38;border-color:#5a5a58}
  .tbtn-panel.tbtn-on{background:#1e3448;border-color:#4a7aaa}
  .tbar-sep{background:#4a4a48}
  button:hover{background:#3a3a38}
  .ptab{border-color:#444441;color:#888780}
  .ptab:hover,.padd:hover{background:#3a3a38}
  .ptab.active{background:#2c2c2a;color:#e8e6e0;border-color:#5f5e5a}
  .pbar{border-color:#444441}
  .proj-row{border-bottom-color:#444441}
  .proj-name{color:#e8e6e0}
  .proj-name.unsaved{color:#888780}
  .proj-lastsaved{color:#5f5e5a}
  .proj-writer-lbl{color:#888780}
  .proj-writer-inp{color:#e8e6e0}
  .proj-writer-inp:focus{border-bottom-color:#5f5e5a}
  .vtog button.on{background:#444441}
  .tbtn-on{background:#444441!important;font-weight:500}
  .astrip{background:#242422;border-color:#444441}
  .astrip.warn{background:#501313;border-color:#a32d2d}
  .astrip button.dbtn{background:#501313;color:#f09595;border-color:#a32d2d}
  .sl{color:#e8e6e0}
  .sl.d{color:#f09595}
  .cf{background:#2c2c2a;border-color:#444441}
  .cf.bk{background:#242422}
  .sn,.bl{color:#888780}
  .st{color:#e8e6e0}
  .bn{color:#b4b2a9}
  .st:empty::before,.bn:empty::before{color:#5f5e5a}
  .cdot{background:#444441;border-color:#5f5e5a}
  .ca button:hover{background:#3a3a38;color:#e8e6e0}
  .ca button.xb:hover{background:#501313;color:#f09595;border-color:#a32d2d}
  .lf{background:#2c2c2a;border-color:#444441}
  .lf.bk{background:#242422}
  .lnum{color:#888780}
  .bgsw{background:#444441;border-color:#5f5e5a}
  .actbtn{border-color:#444441;color:#888780}
  .actbtn:hover{background:#3a3a38;color:#e8e6e0}
  .actbtn.on{background:#e8e6e0;color:#1a1a18;border-color:#e8e6e0}
  .st{caret-color:#e8e6e0!important}
  .bn{caret-color:#b4b2a9!important}
  .fsdot-num{color:#888780}
  .fsdot-btn{color:#888780}
  .cf.filled{box-shadow:inset 0 0 0 1000px rgba(0,0,0,0.13)}
  #limbo-panel{border-left-color:#444441}
  .lp-hdr{border-bottom-color:#444441}
  #notes-panel{border-right-color:#444441}
  .np-note{border-color:#444441}
  .np-note-meta,.np-note-title{border-bottom-color:#3a3a38}
  .lp-srow{border-color:#444441}
  .lp-srow-meta,.lp-srow-title{border-bottom-color:#3a3a38}
  .lp-count{background:#3a3a38;color:#888780}
  .lp-empty{color:#5f5e5a}
  .lp-resize:hover,.lp-resize.active{background:rgba(55,138,221,0.18)}
  #welcome-panel{background:#242422;border-color:#444441}
  .wp-logo{color:#e8e6e0}
  .wp-sub{color:#888780}
  .wp-primary{background:#e8e6e0;color:#1a1a18;border-color:#e8e6e0}
  .wp-primary:hover{background:#f5f4f0}
  .wp-secondary{background:#2c2c2a;color:#e8e6e0;border-color:#444441}
  .wp-secondary:hover{background:#3a3a38}
  .wp-recent-item{color:#e8e6e0}
  .wp-recent-item:hover{background:#3a3a38}
  .wp-pref{color:#5f5e5a;border-top-color:#444441}
  .wp-pref input{accent-color:#e8e6e0}
  .sel-chk{background:#2c2c2a;border-color:#5f5e5a}
  .cwrap.selected .cf{outline-color:#378add;border-color:#378add}
  .lp-link-item{color:#e8e6e0}
  .lp-link-item:hover{background:#3a3a38}
  .lp-link-item.linked{background:#1a2a3a;color:#6ab0f5}
  .link-badge{color:#888780}
  .link-badge:hover{background:#3a3a38;color:#e8e6e0}
}

.bgsw{width:9px;height:9px;border-radius:2px;cursor:pointer;background:#e8e6e0;border:1px solid #b4b2a9;flex-shrink:0;display:inline-block}
.bgsw:hover{transform:scale(1.3)}
.sel-chk{position:absolute;top:7px;left:7px;width:15px;height:15px;border-radius:4px;border:1.5px solid #b4b2a9;background:#fff;z-index:10;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:9px;color:#fff;flex-shrink:0}
.selmode .sel-chk{display:flex}
.cwrap.selected .sel-chk{background:#378add;border-color:#378add}
.cwrap.selected .cf{outline:2px solid #378add;outline-offset:-1px;border-color:#378add}
.selmode .cwrap{cursor:pointer}
.link-badge{font-size:9px;color:#888780;cursor:pointer;padding:0 2px;line-height:1;border-radius:3px;-webkit-app-region:no-drag;flex-shrink:0}
.link-badge:hover{background:#e8e6e0;color:#1a1a18}
.link-badge.active{color:#378add}
.cwrap.link-hi .cf{outline:2px solid #EF9F27;outline-offset:-1px}
.lp-list{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin-top:6px}
.lp-link-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12px;color:#1a1a18}
.lp-link-item:hover{background:#e8e6e0}
.lp-link-item.linked{background:#e8f0fb;color:#1a6bb5}
.szbtn{font-size:10px;padding:1px 5px;color:#888780;background:transparent;border-color:#d3d1c7}
.szbtn:hover{background:#e8e6e0;color:#1a1a18}

body{padding-top:0}
.pbar{padding-top:2.25rem;-webkit-app-region:drag}
  #workspace{flex:1;display:flex;overflow:hidden;min-height:0}
  #notes-panel{width:0;flex-shrink:0;display:flex;flex-direction:row;overflow:hidden;border-right:0 solid #d3d1c7;position:relative}
  #notes-panel.open{border-right-width:1px}
  #notes-panel.np-anim{transition:width 0.2s ease}
  .np-resize{width:6px;flex-shrink:0;cursor:col-resize;background:transparent;z-index:10}
  .np-resize:hover,.np-resize.active{background:rgba(55,138,221,0.25)}
  .np-inner{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:0 8px 4rem 0;min-width:0}
  .np-board{flex:1;overflow-y:auto;overflow-x:hidden}
  .np-note{border:0.5px solid #d3d1c7;border-radius:10px;overflow:hidden;margin-bottom:8px}
  .np-note.drag-over{outline:2px solid #378add;outline-offset:-1px}
  .np-note.dragging{opacity:0.4}
  .np-note-meta{display:flex;align-items:center;gap:4px;padding:4px 8px;border-bottom:0.5px solid #e8e6e0;flex-shrink:0}
  .np-note-title{font-size:14px;font-weight:600;outline:none;padding:7px 10px;line-height:1.4;cursor:text;min-height:28px;border-bottom:0.5px solid #e8e6e0}
  .np-note-body{font-size:13px;outline:none;padding:8px 10px;line-height:1.6;cursor:text;min-height:80px}
  #board{flex:1;overflow-y:auto;padding:1rem 0 4rem}
  #limbo-panel{width:0;flex-shrink:0;display:flex;flex-direction:row;overflow:hidden;border-left:0 solid #d3d1c7;position:relative}
  #limbo-panel.open{border-left-width:1px}
  #limbo-panel.lp-anim{transition:width 0.2s ease}
  .lp-resize{width:6px;flex-shrink:0;cursor:col-resize;background:transparent;z-index:10}
  .lp-resize:hover,.lp-resize.active{background:rgba(55,138,221,0.25)}
  .lp-inner{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:0 0 4rem 8px;min-width:0}
  .lp-board{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
  .lp-drag-hi{outline:2px dashed #378add;outline-offset:-2px;background:rgba(55,138,221,0.04)}
  .lp-hdr{display:flex;align-items:center;gap:6px;padding:1rem 0 8px;flex-shrink:0;border-bottom:1px solid #e8e6e0;margin-bottom:8px;flex-wrap:wrap}
  .lp-title{font-size:11px;font-weight:600;color:#888780;flex:1;letter-spacing:0.08em;text-transform:uppercase}
  .lp-count{font-size:11px;color:#b4b2a9;background:#e8e6e0;border-radius:10px;padding:1px 6px;flex-shrink:0}
  .lp-empty{font-size:12px;color:#b4b2a9;font-style:italic;padding:12px 8px}
  .lp-board .cgrid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .lp-board .cwrap{cursor:default}
  .lp-board .cwrap[draggable="true"]{cursor:grab}
  .note-prev{font-size:10px;color:#b4b2a9;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;flex-shrink:0;margin-top:3px;padding:0 2px;font-weight:400;max-height:28px}
  .act-arrow{font-size:9px;color:#b4b2a9;cursor:pointer;padding:0 3px;transition:transform 0.15s;display:inline-block;line-height:1;-webkit-app-region:no-drag;user-select:none;flex-shrink:0}
  .act-arrow.collapsed{transform:rotate(-90deg)}
  #welcome-overlay{position:fixed;inset:0;background:rgba(26,26,24,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;-webkit-app-region:no-drag}
  #welcome-overlay.hidden{display:none}
  #welcome-panel{background:#f5f4f0;border-radius:16px;padding:30px 34px;width:356px;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,0.28);border:0.5px solid #d3d1c7}
  .wp-logo{font-size:20px;font-weight:700;color:#1a1a18;margin-bottom:4px;letter-spacing:-0.3px}
  .wp-sub{font-size:12px;color:#888780;margin-bottom:22px}
  .wp-primary{width:100%;text-align:left;padding:10px 14px;border-radius:10px;font-size:14px;margin-bottom:8px;background:#1a1a18;color:#f5f4f0;border-color:#1a1a18}
  .wp-primary:hover{background:#2c2c2a}
  .wp-secondary{width:100%;text-align:left;padding:10px 14px;border-radius:10px;font-size:14px;background:#fff;border-color:#d3d1c7}
  .wp-secondary:hover{background:#f1efe8}
  .wp-recent-title{font-size:10px;font-weight:600;color:#b4b2a9;letter-spacing:0.08em;text-transform:uppercase;margin:18px 0 6px}
  .wp-recent-empty{font-size:12px;color:#b4b2a9;font-style:italic;padding:3px 0}
  .wp-recent-item{display:block;width:100%;text-align:left;padding:6px 10px;border-radius:8px;font-size:12px;background:transparent;border:none;color:#1a1a18;cursor:pointer;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;-webkit-app-region:no-drag}
  .wp-recent-item:hover{background:#e8e6e0;color:#1a1a18}
  .wp-pref{display:flex;align-items:center;gap:8px;margin-top:18px;font-size:12px;color:#b4b2a9;cursor:pointer;padding-top:14px;border-top:1px solid #e8e6e0;user-select:none}
  .wp-pref input{cursor:pointer;accent-color:#1a1a18;-webkit-app-region:no-drag}

/* ── Export panel ─────────────────────────────────────────────────────────── */
#export-overlay{position:fixed;inset:0;background:rgba(26,26,24,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;-webkit-app-region:no-drag}
#export-overlay.hidden{display:none}
#export-panel{background:#f5f4f0;border-radius:16px;padding:28px 32px;width:540px;max-height:84vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 64px rgba(0,0,0,0.28);border:0.5px solid #d3d1c7}
.ep-hdr{display:flex;align-items:center;justify-content:space-between}
.ep-title{font-size:17px;font-weight:700;color:#1a1a18;letter-spacing:-0.2px}
.ep-close{font-size:13px;padding:3px 9px;background:transparent;border-color:#d3d1c7;color:#888780}
.ep-instr{background:#f0efe8;border-radius:10px;padding:12px 14px;border:0.5px solid #e0ddd8}
.ep-instr-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ep-instr-ttl{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#888780}
.ep-instr-dismiss{font-size:11px;padding:2px 7px;color:#888780;background:transparent;border-color:#d3d1c7}
.ep-instr-body{font-size:12px;color:#5f5e5a;line-height:1.65}
.ep-instr-body p{margin-bottom:7px}
.ep-instr-body ul{padding-left:16px;display:flex;flex-direction:column;gap:4px}
.ep-instr-body li{list-style:disc}

<body>
<div id="pbar" class="pbar"></div>
<div id="tbar" class="tbar"></div>
<div id="sw"></div>
<div id="workspace"><div id="notes-panel"></div><div id="board"></div><div id="limbo-panel"></div></div>
<div id="welcome-overlay" class="hidden"><div id="welcome-panel"></div></div>
<div id="export-overlay" class="hidden"><div id="export-panel"></div></div>
<script>

function buildSaveData(){
  return {
    version:'2.0',
    writer,
    notes:projectNotes,
    curB,
    boards: boards.map(b=>({
      id:b.id,
      name:b.name,
      cards:byB[b.id]||[],
      legend:legByB[b.id]||{},
      limbo:limboByB[b.id]||[],
    })),
    nid,
    savedAt:new Date().toISOString(),
  };
}

function loadFromData(data){
  // Migrate old single-board format (version 1.0)
  if(!data.boards){
    const projId='p1';
    boards=[{id:projId,name:data.name||'Board 1'}];
    curB=projId;
    byB={[projId]:data.cards||[]};
    legByB={[projId]:data.legend||{}};
    limboByB={[projId]:data.limbo||[]};
    projectNotes=data.notes||[];
    nid=data.nid||((data.cards||[]).length+1);
    writer=data.writer||'';
  } else {
    // New multi-board format (version 2.0)
    boards=data.boards.map(b=>({id:b.id,name:b.name}));
    curB=data.curB||data.boards[0].id;
    byB={};legByB={};limboByB={};
    data.boards.forEach(b=>{
      byB[b.id]=b.cards||[];
      legByB[b.id]=b.legend||{};
      limboByB[b.id]=b.limbo||[];
    });
    nid=data.nid||1;
    writer=data.writer||'';
    // Migrate: project-level notes (new) or collect from boards (old per-board format)
    if(data.notes){projectNotes=data.notes;}
    else{projectNotes=[];data.boards.forEach(b=>{if(b.notes&&b.notes.length)projectNotes=projectNotes.concat(b.notes);});}
  }
  hist=[];actFilter.clear();colorSpot.clear();cpPanel=null;cpId=null;collapsedActs.clear();selectedCards.clear();selMode=false;limboSelectedCards.clear();limboSelMode=false;linkHighlight=null;
  Object.values(byB).forEach(arr=>{if(Array.isArray(arr))arr.forEach(migrateColors);});
  lastSavedAt=data.savedAt||null;
  isDirty=false;
  updateWindowMeta();
  render();
}

function updateWindowMeta(){
  if(!window.electronAPI)return;
  const board=boards.find(b=>b.id===curB);
  const name=board?board.name:'Untitled';
  window.electronAPI.setTitle(name);
  window.electronAPI.setEdited(isDirty);
}

async function handleSave(){
  if(!window.electronAPI)return;
  const data=buildSaveData();
  if(currentFilePath){
    const r=await window.electronAPI.fileSave(data,currentFilePath);
    if(r&&r.success){lastSavedAt=new Date().toISOString();isDirty=false;updateWindowMeta();renderPbar();}
    return r;
  }
  return handleSaveAs();
}

async function handleSaveAs(){
  if(!window.electronAPI)return;
  const data=buildSaveData();
  const r=await window.electronAPI.fileSaveAs(data);
  if(r&&r.success){
    currentFilePath=r.filePath;
    lastSavedAt=new Date().toISOString();isDirty=false;
    updateWindowMeta();
    renderPbar();
  }
  return r;
}

function checkDirtyThen(action){
  if(!isDirty){action();return;}
  const board=boards.find(b=>b.id===curB);
  const name=(board&&board.name)||'Untitled';
  if(confirm('Save changes to "'+name+'" before continuing?')){
    handleSave().then(r=>{if(r&&(r.success||r.cancelled))action();});
  } else {
    action();
  }
}


const COLORS=[
  {k:'none',h:null},{k:'red',h:'#E24B4A'},{k:'coral',h:'#D85A30'},
  {k:'amber',h:'#EF9F27'},{k:'yellow',h:'#d4a500'},{k:'lime',h:'#639922'},
  {k:'teal',h:'#1D9E75'},{k:'sky',h:'#378ADD'},{k:'indigo',h:'#534AB7'},
  {k:'violet',h:'#7F77DD'},{k:'pink',h:'#D4537E'},{k:'gray',h:'#888780'}
];
// File-based storage in Electron
let boards=[{id:'p1',name:'Board 1'}];
let curB='p1';
let byB={'p1':[]};
let nid=1;
let hist=[];let cardHist={};let cardRedo={};let redoHist=[];
let pend=null;
let pendBoard=false;  // true when add-board prompt is showing
let cpId=null;
let cpPanel=null;
let flipped=false;
let view='grid';
let fitMode=false;
let colFlow=false;
let legByB={};
let colorSpot=new Set();
let actFilter=new Set();
let dsrc=null;
let stmr=null;
let zoomLevel=100;
let limboByB={};
let projectNotes=[];
let writer='';
let lastSavedAt=null;
let limboOpen=false;
let limboSelMode=false;
let limboSelectedCards=new Set();
let notesOpen=false;
let notesWidth=360;
let pendMove=null;
let collapsedActs=new Set();
let showPrev=false;
let selectedCards=new Set();
let selMode=false;
let linkHighlight=null;
let limboView='grid';
let limboFlipped=false;
let limboFitMode=false;
let limboWidth=360;
let dsrcLimbo=null;
let dsrcNote=null;
let pendExport=null;
let exportFmt='fountain';
let exportBeatsOnly=false;

let currentFilePath=null;
let isDirty=false;

const C=()=>byB[curB]||(byB[curB]=[]);
const countedScenes=()=>{
  const sections=getActSections();
  const visibleIds=actFilter.size===0?null:(()=>{
    const ids=new Set();
    sections.filter(s=>actFilter.has(s.label)).forEach(s=>s.ids.forEach(id=>ids.add(id)));
    return ids;
  })();
  return C().filter(c=>!c.nocount&&(!visibleIds||visibleIds.has(c.id)));
};
const isActHeader=c=>c.nocount&&/act/i.test(c.title||'');
const getActSections=()=>{
  const sections=[];
  let cur=null;
  C().forEach(c=>{
    if(isActHeader(c)){cur={label:(c.title||'').trim(),ids:new Set([c.id])};sections.push(cur);}
    else if(cur){cur.ids.add(c.id);}
  });
  return sections;
};
const L=()=>legByB[curB]||(legByB[curB]={});
const cHex=k=>(COLORS.find(c=>c.k===k)||{}).h||null;
const textColor=hex=>{if(!hex)return null;const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return(0.299*r+0.587*g+0.114*b)/255<0.55?'#f5f4f0':'#1a1a18';};
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const getFS=c=>(c.fs||14)+'px';
const colorDotStyle=colors=>{
  if(!colors||!colors.length)return'';
  if(colors.length===1)return`background:${cHex(colors[0])};border:none;`;
  const pct=100/colors.length;
  const stops=colors.map((k,i)=>`${cHex(k)} ${(i*pct).toFixed(1)}% ${((i+1)*pct).toFixed(1)}%`).join(',');
  return`background:conic-gradient(${stops});border:none;`;
};
const makeColorBar=colors=>{
  if(!colors||!colors.length)return'';
  const vis=colorSpot.size===0?colors:colors.filter(k=>colorSpot.has(k));
  if(!vis.length)return'';
  return`<div class="color-bar">${vis.map(k=>`<span style="background:${cHex(k)};flex:1;display:block"></span>`).join('')}</div>`;
};
const migrateColors=c=>{if(!c.colors)c.colors=(c.color&&c.color!=='none')?[c.color]:[];};
const flash=()=>{const d=document.getElementById('sdot');if(d){d.classList.add('on');setTimeout(()=>d.classList.remove('on'),1200);}};
const clearDO=()=>document.querySelectorAll('.cwrap,.lrow').forEach(e=>e.classList.remove('drag-over'));
const findCardAnywhere=id=>(C().find(x=>x.id===id))||((limboByB[curB]||[]).find(x=>x.id===id));
const isLimboCard=id=>!!(limboByB[curB]||[]).find(x=>x.id===id);

async function doLoad(){
  if(window.electronAPI){
    try{
      const d=await window.electronAPI.getWelcomeData();
      if(d.showWelcome&&!currentFilePath){showWelcomePanel();return;}
    }catch(e){}
  }
  if(!currentFilePath)startFreshProject();
}

function startFreshProject(){
  currentFilePath=null;
  boards=[{id:'p1',name:'Board 1'}];
  curB='p1';byB={'p1':[]};nid=1;legByB={};limboByB={'p1':[]};projectNotes=[];writer='';
  hist=[];actFilter.clear();colorSpot.clear();cpPanel=null;cpId=null;collapsedActs.clear();selectedCards.clear();selMode=false;limboSelectedCards.clear();limboSelMode=false;linkHighlight=null;
  C().push({id:nid++,title:'Opening image',notes:'',colors:[],fs:14,size:'md',links:[]},
           {id:nid++,title:'Inciting incident',notes:'',colors:[],fs:14,size:'md',links:[]},
           {id:nid++,title:'',notes:'',colors:[],fs:14,size:'md',links:[]});
  isDirty=false;
  updateWindowMeta();
  render();
}

function sched(){
  isDirty=true;
  if(window.electronAPI) window.electronAPI.setEdited(true);
  flash();
  clearTimeout(stmr);
  stmr=setTimeout(()=>{
    if(currentFilePath&&window.electronAPI){
      const data=buildSaveData();
      window.electronAPI.fileSave(data,currentFilePath).then(r=>{
        if(r&&r.success){isDirty=false;window.electronAPI.setEdited(false);}
      });
    }
  },1500);
}

function pushH(){
  hist.push({board:curB,snap:JSON.stringify(C()),limboSnap:JSON.stringify(limboByB[curB]||[])});
  if(hist.length>30)hist.shift();
  redoHist=[];
}

function pushCH(id){
  const c=C().find(x=>x.id===id);if(!c)return;
  if(!cardHist[id])cardHist[id]=[];
  const last=cardHist[id][cardHist[id].length-1];
  const snap={title:c.title,notes:c.notes};
  if(last&&last.title===snap.title&&last.notes===snap.notes)return;
  cardHist[id].push(snap);if(cardHist[id].length>50)cardHist[id].shift();
  if(!cardRedo[id])cardRedo[id]=[];cardRedo[id]=[];
}

function undo(){
  const ae=document.activeElement;
  if(ae&&(ae.classList.contains('st')||ae.classList.contains('bn'))){
    const id=parseInt(ae.dataset.id);
    if(!cardHist[id]||!cardHist[id].length)return;
    const c=C().find(x=>x.id===id);if(!c)return;
    if(!cardRedo[id])cardRedo[id]=[];
    cardRedo[id].push({title:c.title,notes:c.notes});
    const snap=cardHist[id].pop();
    c.title=snap.title;c.notes=snap.notes;
    const st=document.querySelector('.st[data-id="'+id+'"]');
    const bn=document.querySelector('.bn[data-id="'+id+'"]');
    if(st)st.innerText=c.title;if(bn)bn.innerHTML=c.notes;
    sched();return;
  }
  for(let i=hist.length-1;i>=0;i--){
    if(hist[i].board===curB){
      redoHist.push({board:curB,snap:JSON.stringify(C()),limboSnap:JSON.stringify(limboByB[curB]||[])});
      byB[curB]=JSON.parse(hist[i].snap);
      if(hist[i].limboSnap!==undefined)limboByB[curB]=JSON.parse(hist[i].limboSnap);
      hist.splice(i,1);sched();pend=null;cpId=null;render();return;
    }
  }
}

function redo(){
  const ae=document.activeElement;
  if(ae&&(ae.classList.contains('st')||ae.classList.contains('bn'))){
    const id=parseInt(ae.dataset.id);
    if(!cardRedo[id]||!cardRedo[id].length)return;
    const c=C().find(x=>x.id===id);if(!c)return;
    if(!cardHist[id])cardHist[id]=[];
    cardHist[id].push({title:c.title,notes:c.notes});
    const snap=cardRedo[id].pop();
    c.title=snap.title;c.notes=snap.notes;
    const st=document.querySelector('.st[data-id="'+id+'"]');
    const bn=document.querySelector('.bn[data-id="'+id+'"]');
    if(st)st.innerText=c.title;if(bn)bn.innerHTML=c.notes;
    sched();return;
  }
  if(!redoHist.length)return;
  const last=redoHist.pop();
  if(last.board===curB){
    hist.push({board:curB,snap:JSON.stringify(C()),limboSnap:JSON.stringify(limboByB[curB]||[])});
    byB[curB]=JSON.parse(last.snap);
    if(last.limboSnap!==undefined)limboByB[curB]=JSON.parse(last.limboSnap);
    sched();pend=null;cpId=null;render();
  }
}

function switchB(id){curB=id;hist=hist.filter(h=>h.board===id);pend=null;cpPanel=null;cpId=null;flipped=false;actFilter.clear();colorSpot.clear();collapsedActs.clear();selectedCards.clear();selMode=false;limboSelectedCards.clear();limboSelMode=false;linkHighlight=null;if(!limboByB[id])limboByB[id]=[];if(!byB[curB])byB[curB]=[];if(!legByB[curB])legByB[curB]={};sched();render();}

function addB(e){
  const hasContent=boards.length>1||C().length>0;
  if(!hasContent){doAddBlankBoard();return;}
  const anchorEl=e&&(e.currentTarget||e.target);
  showPopup(pop=>{
    const ttl=document.createElement('div');ttl.className='sc-popup-title';ttl.textContent='Add Board';pop.appendChild(ttl);
    const blankBtn=document.createElement('button');blankBtn.className='sc-popup-dest-btn';blankBtn.textContent='Blank board';
    blankBtn.addEventListener('click',()=>{hidePopup();doAddBlankBoard();});pop.appendChild(blankBtn);
    if(boards.length>0){
      const sep=document.createElement('div');sep.style.cssText='font-size:11px;color:#b4b2a9;margin:6px 0 4px';sep.textContent='Duplicate:';pop.appendChild(sep);
      boards.forEach(b=>{
        const dupBtn=document.createElement('button');dupBtn.className='sc-popup-dest-btn';dupBtn.style.fontSize='11px';dupBtn.textContent=b.name;
        dupBtn.addEventListener('click',()=>{hidePopup();doDuplicateBoard(b.id);});pop.appendChild(dupBtn);
      });
    }
    const cc=document.createElement('button');cc.className='sc-popup-cancel';cc.textContent='Cancel';
    cc.addEventListener('click',hidePopup);pop.appendChild(cc);
  },anchorEl);
}

function doAddBlankBoard(){
  const id='p'+Date.now();
  boards.push({id,name:'New Board'});
  byB[id]=[];curB=id;hist=[];pend=null;cpId=null;pendBoard=false;sched();render();
  setTimeout(()=>{
    const tabs=document.querySelectorAll('.ptab-name');
    const last=tabs[tabs.length-1];
    if(last){last.contentEditable='true';last.focus();const r=document.createRange();r.selectNodeContents(last);window.getSelection().removeAllRanges();window.getSelection().addRange(r);}
  },60);
}

function doDuplicateBoard(sourceId){
  const source=boards.find(b=>b.id===sourceId);if(!source)return;
  const id='p'+Date.now();
  const name=source.name+' copy';
  boards.push({id,name});
  byB[id]=JSON.parse(JSON.stringify(byB[sourceId]||[]));
  legByB[id]=JSON.parse(JSON.stringify(legByB[sourceId]||{}));
  limboByB[id]=JSON.parse(JSON.stringify(limboByB[sourceId]||[]));

function duplicateCard(cardId){

function moveToLimbo(cardId){
  const idx=C().findIndex(c=>c.id===cardId);
  if(idx===-1)return;
  // Capture origin before removing the card
  let originAct=null;
  C().forEach(c=>{if(isActHeader(c))originAct=(c.title||'');});
  let actBeforeCard=null;
  for(let i=idx;i>=0;i--){if(isActHeader(C()[i])){actBeforeCard=(C()[i].title||'');break;}}
  pushH();
  const [card]=C().splice(idx,1);
  card._originSn=card.sn;
  card._originAct=actBeforeCard;
  card._originPrev=idx>0?C()[idx-1]&&C()[idx-1].id:null;
  card._originNext=idx<C().length?C()[idx]&&C()[idx].id:null;
  if(!limboByB[curB])limboByB[curB]=[];
  limboByB[curB].push(card);
  pend=null;sched();renderBoard();renderTbar();renderLimbo();
}

function restoreFromLimbo(cardId){
  const lb=limboByB[curB]||[];
  const idx=lb.findIndex(c=>c.id===cardId);
  if(idx===-1)return;
  pushH();
  const [card]=lb.splice(idx,1);
  // Try to place near original neighbors; fall back to end of board
  let placed=false;
  if(card._originPrev!=null){
    const pi=C().findIndex(c=>c.id===card._originPrev);
    if(pi!==-1){C().splice(pi+1,0,card);placed=true;}
  }
  if(!placed&&card._originNext!=null){
    const ni=C().findIndex(c=>c.id===card._originNext);
    if(ni!==-1){C().splice(ni,0,card);placed=true;}
  }
  if(!placed)C().push(card);
  // Clear origin metadata now that card is back on the board
  delete card._originSn;delete card._originAct;
  delete card._originPrev;delete card._originNext;
  sched();renderBoard();renderTbar();renderLimbo();
}

function applyLimboFit(){
  const lb=document.getElementById('lp-board');if(!lb)return;
  const cards=limboByB[curB]||[];
  const grid=lb.querySelector('.cgrid');
  if(!cards.length||limboView==='list'){if(grid){grid.style.gridTemplateColumns='';grid.style.zoom='';}return;}
  if(!grid)return;
  const panelW=lb.clientWidth||limboWidth-16;
  const lbH=lb.clientHeight||400;
  const n=cards.length;const cardW=212;const cardH=172;
  let bestZoom=0,bestCols=1;
  for(let cols=1;cols<=n;cols++){
    const rows=Math.ceil(n/cols);
    const zw=panelW/(cols*cardW);
    const zh=lbH/(rows*cardH);
    const z=Math.min(zw,zh,1);
    if(z>bestZoom){bestZoom=z;bestCols=cols;}
  }
  grid.style.gridTemplateColumns=`repeat(${bestCols},1fr)`;
  grid.style.zoom=bestZoom;
}

function limboBulkSelected(){
  if(!selectedCards.size)return;
  pushH();
  if(!limboByB[curB])limboByB[curB]=[];
  const keep=[],moved=[];
  let actTrack=null;
  (byB[curB]||[]).forEach((c,idx)=>{
    if(isActHeader(c))actTrack=(c.title||'');
    if(selectedCards.has(c.id)){
      c._originSn=c.sn;
      c._originAct=actTrack;
      c._originPrev=idx>0?(byB[curB][idx-1]&&byB[curB][idx-1].id):null;
      c._originNext=idx<(byB[curB].length-1)?(byB[curB][idx+1]&&byB[curB][idx+1].id):null;
      moved.push(c);
    } else {
      keep.push(c);
    }
  });
  byB[curB]=keep;
  limboByB[curB]=limboByB[curB].concat(moved);
  selectedCards.clear();selMode=false;sched();renderBoard();renderTbar();renderLimbo();renderSW();

// ── Popup panel system ─────────────────────────────────────────────────────
function showPopup(buildFn,anchorEl){
  let bd=document.getElementById('sc-popup-backdrop');
  if(!bd){bd=document.createElement('div');bd.id='sc-popup-backdrop';document.body.appendChild(bd);bd.addEventListener('click',hidePopup);}
  let pop=document.getElementById('sc-popup');
  if(!pop){pop=document.createElement('div');pop.id='sc-popup';document.body.appendChild(pop);}
  pop.innerHTML='';
  buildFn(pop);
  bd.classList.add('open');
  pop.classList.add('open');pop.style.display='block';
  requestAnimationFrame(()=>positionPopup(pop,anchorEl));
}
function positionPopup(pop,anchorEl){
  if(!anchorEl){pop.style.left='50%';pop.style.top='35%';pop.style.transform='translateX(-50%)';return;}
  pop.style.transform='';
  const rect=anchorEl.getBoundingClientRect();
  const pw=pop.offsetWidth||240;const ph=pop.offsetHeight||100;
  let left=rect.left,top=rect.bottom+6;
  if(left+pw>window.innerWidth-12)left=window.innerWidth-pw-12;
  if(left<12)left=12;
  if(top+ph>window.innerHeight-12)top=rect.top-ph-6;
  if(top<12)top=12;
  pop.style.left=left+'px';pop.style.top=top+'px';
}
function hidePopup(){
  const bd=document.getElementById('sc-popup-backdrop');
  const pop=document.getElementById('sc-popup');
  if(bd)bd.classList.remove('open');
  if(pop){pop.classList.remove('open');pop.style.display='none';}
}
function showDelPopup(msg,anchorEl,onConfirm){
  showPopup(pop=>{
    const lbl=document.createElement('div');lbl.className='sc-popup-del-msg';lbl.textContent=msg;pop.appendChild(lbl);
    const row=document.createElement('div');row.className='sc-popup-row';
    const yb=document.createElement('button');yb.textContent='Delete';
    yb.style.cssText='background:#fcebeb;color:#a32d2d;border-color:#f09595;font-size:12px;padding:4px 12px';
    yb.addEventListener('click',()=>{hidePopup();onConfirm();});
    const nb=document.createElement('button');nb.textContent='Cancel';nb.style.cssText='font-size:12px;padding:4px 10px';
    nb.addEventListener('click',hidePopup);
    row.appendChild(yb);row.appendChild(nb);pop.appendChild(row);
  },anchorEl);
}
function showMoveCardPopup(cardId,source,anchorEl){

function doMoveCard(cardId,source,targetBoardId,dest){
  if(source==='board'){
    const idx=C().findIndex(c=>c.id===cardId);if(idx===-1)return;
    pushH();const[card]=C().splice(idx,1);card.colors=card.colors||[];
    if(dest==='limbo'){if(!limboByB[targetBoardId])limboByB[targetBoardId]=[];limboByB[targetBoardId].push(card);}
    else{if(!byB[targetBoardId])byB[targetBoardId]=[];byB[targetBoardId].push(card);}
    sched();renderBoard();renderTbar();
  } else if(source==='limbo'){
    const lb=limboByB[curB]||[];const idx=lb.findIndex(c=>c.id===cardId);if(idx===-1)return;
    const[card]=lb.splice(idx,1);
    delete card._originSn;delete card._originAct;delete card._originPrev;delete card._originNext;
    if(dest==='limbo'){if(!limboByB[targetBoardId])limboByB[targetBoardId]=[];limboByB[targetBoardId].push(card);}
    else{if(!byB[targetBoardId])byB[targetBoardId]=[];byB[targetBoardId].push(card);}
    sched();renderLimbo();renderTbar();
  }
}
function moveSelectedToBoard(targetBoardId,dest){
  if(!selectedCards.size)return;
  pushH();
  const toMove=(byB[curB]||[]).filter(c=>selectedCards.has(c.id));
  byB[curB]=(byB[curB]||[]).filter(c=>!selectedCards.has(c.id));
  toMove.forEach(card=>{
    card.colors=card.colors||[];
    if(dest==='limbo'){if(!limboByB[targetBoardId])limboByB[targetBoardId]=[];limboByB[targetBoardId].push(card);}
    else{if(!byB[targetBoardId])byB[targetBoardId]=[];byB[targetBoardId].push(card);}
  });
  selectedCards.clear();selMode=false;sched();renderBoard();renderTbar();renderSW();
}
function toggleLimboSelMode(){
  limboSelMode=!limboSelMode;
  if(!limboSelMode)limboSelectedCards.clear();
  renderLimbo();
}
function toggleLimboCardSel(cardId){
  if(limboSelectedCards.has(cardId))limboSelectedCards.delete(cardId);
  else limboSelectedCards.add(cardId);
  renderLimbo();
}
function limboBulkMoveToBoard(targetBoardId,dest){
  if(!limboSelectedCards.size)return;
  const lb=limboByB[curB]||[];
  const toMove=lb.filter(c=>limboSelectedCards.has(c.id));
  limboByB[curB]=lb.filter(c=>!limboSelectedCards.has(c.id));
  toMove.forEach(card=>{
    delete card._originSn;delete card._originAct;delete card._originPrev;delete card._originNext;
    card.colors=card.colors||[];
    if(dest==='limbo'){if(!limboByB[targetBoardId])limboByB[targetBoardId]=[];limboByB[targetBoardId].push(card);}
    else{if(!byB[targetBoardId])byB[targetBoardId]=[];byB[targetBoardId].push(card);}
  });
  limboSelectedCards.clear();limboSelMode=false;
  sched();renderBoard();renderTbar();renderLimbo();
}
function deleteSelectedLimboCards(){
  limboByB[curB]=(limboByB[curB]||[]).filter(c=>!limboSelectedCards.has(c.id));
  limboSelectedCards.clear();limboSelMode=false;
  sched();renderLimbo();renderTbar();
}

function renderPbar(){
  const bar=document.getElementById('pbar');bar.innerHTML='';

  // ── Project info row ──────────────────────────────────────────────────────
  const projRow=document.createElement('div');projRow.className='proj-row';

  // Project name + last saved (read-only)
  const projCenter=document.createElement('div');projCenter.className='proj-center';
  const projName=document.createElement('span');
  if(currentFilePath){
    const fname=currentFilePath.split('/').pop().replace(/\.screenplaycards$/i,'');
    projName.textContent=fname;
    projName.className='proj-name';
    projName.title=currentFilePath;
  } else {
    projName.textContent='Unsaved Project';
    projName.className='proj-name unsaved';
  }
  projCenter.appendChild(projName);
  if(lastSavedAt){
    const ls=document.createElement('span');ls.className='proj-lastsaved';
    const d=new Date(lastSavedAt);
    ls.textContent='Last edited '+d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    projCenter.appendChild(ls);
  }
  projRow.appendChild(projCenter);

  // Writer field
  const writerWrap=document.createElement('div');writerWrap.className='proj-writer-wrap';
  const writerLbl=document.createElement('span');writerLbl.className='proj-writer-lbl';writerLbl.textContent='Written by:';
  const writerInp=document.createElement('input');writerInp.type='text';writerInp.className='proj-writer-inp';
  writerInp.placeholder='writer name(s)';writerInp.value=writer;
  writerInp.addEventListener('mousedown',e=>e.stopPropagation());
  writerInp.addEventListener('input',e=>{writer=e.target.value;sched();});
  writerWrap.appendChild(writerLbl);writerWrap.appendChild(writerInp);
  projRow.appendChild(writerWrap);
  bar.appendChild(projRow);

  // ── Board tabs row ────────────────────────────────────────────────────────
  const boardRow=document.createElement('div');boardRow.className='board-row';
  boards.forEach(p=>{
    const tab=document.createElement('div');
    tab.className='ptab'+(p.id===curB?' active':'');
    const nm=document.createElement('span');nm.className='ptab-name';nm.textContent=p.name;
    nm.addEventListener('mousedown',e=>e.stopPropagation());
    nm.addEventListener('dblclick',()=>{nm.contentEditable='true';nm.focus();const r=document.createRange();r.selectNodeContents(nm);window.getSelection().removeAllRanges();window.getSelection().addRange(r);});
    nm.addEventListener('blur',()=>{if(nm.contentEditable==='true')renameB(p.id,nm);});
    nm.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();nm.blur();}if(e.key==='Escape')nm.blur();});
    tab.appendChild(nm);
    if(boards.length>1){
      const x=document.createElement('span');x.className='ptab-x';x.textContent='✕';x.title='delete board';
      x.addEventListener('click',e=>{e.stopPropagation();reqDelB(p.id,e.currentTarget);});
      tab.appendChild(x);
    }
    tab.addEventListener('click',e=>{
      if(e.target===nm&&nm.contentEditable==='true')return;
      if(e.target.classList.contains('ptab-x'))return;
      if(p.id!==curB)switchB(p.id);
    });
    boardRow.appendChild(tab);
  });
  const ab=document.createElement('div');ab.className='padd';ab.textContent='+ board';
  ab.addEventListener('click',e=>addB(e));boardRow.appendChild(ab);
  bar.appendChild(boardRow);
}

function renderActBar(){
  const bar=document.getElementById('actbar');if(!bar)return;
  bar.innerHTML='';
  const sections=getActSections();
  if(!sections.length){actFilter.clear();return;}
  const allBtn=document.createElement('button');
  allBtn.className='actbtn'+(actFilter.size===0?' on':'');
  allBtn.textContent='all';
  allBtn.addEventListener('click',()=>{actFilter.clear();renderActBar();renderBoard();});
  bar.appendChild(allBtn);
  sections.forEach(s=>{
    const btn=document.createElement('button');
    btn.className='actbtn'+(actFilter.has(s.label)?' on':'');
    btn.textContent=s.label;
    btn.addEventListener('click',()=>{
      if(actFilter.has(s.label))actFilter.delete(s.label);
      else actFilter.add(s.label);
      if(actFilter.size===sections.length)actFilter.clear();
      renderActBar();renderBoard();
    });
    bar.appendChild(btn);
  });
}

function renumber(){let sn=1;C().forEach(c=>{if(c.nocount)c.sn=null;else c.sn=sn++;});}

function renderBoard(){
  renumber();
  const b=document.getElementById('board');
  const sections=getActSections();
  const visibleIds=actFilter.size===0?null:(()=>{
    const ids=new Set();
    sections.filter(s=>actFilter.has(s.label)).forEach(s=>s.ids.forEach(id=>ids.add(id)));
    return ids;
  })();

  b.className=view==='list'?'clist':'cgrid'+(selMode?' selmode':'');b.innerHTML='';
  // Accept drops from limbo onto board background (appends to end)
  if(!b._limboDropInit){
    b._limboDropInit=true;
    b.addEventListener('dragover',e=>{if(dsrcLimbo){e.preventDefault();}});
    b.addEventListener('drop',e=>{
      if(!dsrcLimbo)return;
      e.preventDefault();clearDO();
      const lb=limboByB[curB]||[];
      const li=lb.findIndex(c=>c.id===dsrcLimbo);
      if(li!==-1){pushH();const[card]=lb.splice(li,1);delete card._originSn;delete card._originAct;delete card._originPrev;delete card._originNext;C().push(card);sched();renderBoard();renderTbar();renderLimbo();}
      dsrcLimbo=null;
    });
  }
  let _actCollapsed=false;
  C().forEach((c,i)=>{
    if(visibleIds&&!visibleIds.has(c.id))return;
    if(isActHeader(c)){_actCollapsed=collapsedActs.has(c.id);}
    else if(_actCollapsed)return;
    b.appendChild(view==='list'?makeLRow(c,i):makeCrd(c,i));
  });

  const cnt=document.getElementById('cnt');
  if(cnt)cnt.textContent=countedScenes().length+' scene'+(countedScenes().length===1?'':'s');
  const ub=document.getElementById('ub');
  if(ub){const h=hist.some(x=>x.board===curB);ub.style.opacity=h?1:0.4;ub.style.pointerEvents=h?'auto':'none';}
  applyFit();applyFlow();autoFitTitles();
}

function setDarkCaret(el){
  const dark=window.matchMedia('(prefers-color-scheme:dark)').matches;
  el.style.caretColor=dark?(el.classList.contains('st')?'#e8e6e0':'#b4b2a9'):'auto';
}
function attachEditable(el,wrap){
  setDarkCaret(el);
  el.addEventListener('mousedown',()=>{wrap.draggable=false;});
  el.addEventListener('focus',()=>{setDarkCaret(el);});
  el.addEventListener('blur',()=>{wrap.draggable=true;setDarkCaret(el);});
  el.addEventListener('input',e=>{setDarkCaret(el);onEdit(e);});
  el.addEventListener('keydown',e=>{
    if(e.key==='Tab'){
      e.preventDefault();
      const id=parseInt(el.dataset.id);
      if(!isNaN(id)&&!isLimboCard(id))insertCardAfter(id);
    }
  });
}
// Re-apply caret color on scheme change
window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{
  document.querySelectorAll('.st,.bn').forEach(setDarkCaret);
});


function makeCrd(c,i){
  const w=document.createElement('div');

  w.addEventListener('dragstart',function(e){dsrc=this;this.classList.add('dragging');e.dataTransfer.effectAllowed='move';});

  w.addEventListener('drop',onDrop);

  w.innerHTML='<div class="ci">'
    +'<div class="cf'+(bgHex?' filled':'')+'" style="'+cs+'">'
    +selChkHtml
    +cbar
    +'<div class="sn" style="'+ts+'"><span class="sntog'+(c.nocount?' excluded':'')+'" title="'+(c.nocount?'click to restore scene number':'click to exclude from numbering')+'">'+(c.nocount?'\u2014':'SC. '+c.sn)+'</span>'+actArrow+linkBadge+'<button class="dupeb" style="font-size:9px;padding:0 3px;background:transparent;border:none;color:#b4b2a9;'+ts+'" title="duplicate">⎘</button><span class="cdot" style="'+ds+'" title="accent colors"></span></div>'
    +'<div class="st" contenteditable spellcheck="true" data-id="'+c.id+'" data-field="title" style="font-size:'+getFS(c)+';'+ts+'">'+esc(c.title)+'</div>'
    +notePrev
    +'<div class="ca">'
    +'<span class="fsdot"><button class="fsdot-btn fsdot-dn" title="decrease font size">&#8249;</button><span class="fsdot-num" style="background:'+(bgHex||'transparent')+';'+(tc?'color:'+tc+';':'')+'">'+(c.fs||14)+'</span><button class="fsdot-btn fsdot-up" title="increase font size">&#8250;</button></span>'
    +'<span class="spacer"></span>'
    +'<span class="bgsw" style="'+bds+'" title="fill color"></span>'

    +cbar

  const titleEl=w.querySelector('.st');

  w.querySelector('.bgsw').addEventListener('click',e=>{e.stopPropagation();openCP(c.id,'bg');});

  const lb=w.querySelector('.limbob');if(lb)lb.addEventListener('click',e=>{e.stopPropagation();moveToLimbo(c.id);});

        num.style.background=cHex(card.bgColor)||'transparent';
        num.style.color=textColor(cHex(card.bgColor))||'';
      }
    }
    function addHoldBehavior(btn,delta){
      let holdTimer=null,holdInterval=null;
      btn.addEventListener('mousedown',e=>{
        e.stopPropagation();
        applyFS(delta);
        holdTimer=setTimeout(()=>{holdInterval=setInterval(()=>applyFS(delta),80);},400);
      });
      const cancel=()=>{clearTimeout(holdTimer);clearInterval(holdInterval);holdTimer=null;holdInterval=null;};
      btn.addEventListener('mouseup',cancel);
      btn.addEventListener('mouseleave',cancel);
    }
    addHoldBehavior(fsdot.querySelector('.fsdot-up'),1);

function onDrop(e){
  e.preventDefault();clearDO();
  // Case 1: limbo card dropped on a board card – restore at that position
  if(dsrcLimbo){
    const toIdx=parseInt(this.dataset.idx);
    if(!isNaN(toIdx)){
      const lb=limboByB[curB]||[];
      const li=lb.findIndex(c=>c.id===dsrcLimbo);
      if(li!==-1){pushH();const[card]=lb.splice(li,1);delete card._originSn;delete card._originAct;delete card._originPrev;delete card._originNext;C().splice(toIdx,0,card);sched();renderBoard();renderTbar();renderLimbo();}
    }
    dsrcLimbo=null;return;
  }
  // Case 2: normal board reorder
  if(!dsrc||dsrc===this)return;
  const from=parseInt(dsrc.dataset.idx),to=parseInt(this.dataset.idx);
  if(isNaN(from)||isNaN(to))return;
  pushH();const moved=C().splice(from,1)[0];C().splice(to,0,moved);sched();renderBoard();
}

function autoFitTitles(){
  // Display-only: shrink title text until it fits the card face.
  // The stored c.fs value is never modified.
  if(view==='list')return;
  requestAnimationFrame(()=>{
    document.querySelectorAll('#board .cwrap .cf:not(.bk) .st').forEach(el=>{
      const id=parseInt(el.dataset.id);
      const c=C().find(x=>x.id===id);if(!c)return;
      const stored=c.fs||14;
      el.style.fontSize=stored+'px'; // reset to stored size each render
      if(el.scrollHeight<=el.clientHeight+2)return; // already fits
      let fs=stored;
      while(el.scrollHeight>el.clientHeight+2&&fs>7){
        fs--;
        el.style.fontSize=fs+'px';
      }
    });
  });
}

function applyFit(){
  const b=document.getElementById('board');
  if(!fitMode||view==='list'||!C().length){b.style.zoom='';b.style.gridTemplateColumns='';return;}
  const n=C().length;
  const vw=window.innerWidth-48;
  const tbar=document.getElementById('tbar');
  const pbar=document.getElementById('pbar');
  const sw=document.getElementById('sw');
  const usedH=(tbar?tbar.offsetHeight:50)+(pbar?pbar.offsetHeight:40)+(sw?sw.offsetHeight:0)+64;
  const availH=window.innerHeight-usedH;
  const cardW=212;
  const cardH=172;
  let bestZoom=0;
  let bestCols=1;
  for(let cols=1;cols<=n;cols++){
    const rows=Math.ceil(n/cols);
    const zw=vw/(cols*cardW);
    const zh=availH/(rows*cardH);
    const z=Math.min(zw,zh,1);
    if(z>bestZoom){bestZoom=z;bestCols=cols;}
  }
  b.style.gridTemplateColumns=`repeat(${bestCols},1fr)`;
  b.style.zoom=bestZoom;
  zoomLevel=Math.round(bestZoom*100);
  const sl=document.getElementById('zslider');const zv=document.getElementById('zval');
  if(sl)sl.value=zoomLevel;if(zv)zv.textContent=zoomLevel+'%';
  autoFitTitles();
}

  const url=URL.createObjectURL(blob);

  const name=(proj?proj.name.replace(/[^a-z0-9]/gi,'-').toLowerCase():'project')+'-'+new Date().toISOString().slice(0,10);

    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(!d.p||!d.b)throw new Error('invalid');
        boards=d.p;curB=d.c;byB=d.b;nid=d.n||1;legByB=d.l||{};
        hist=[];actFilter.clear();colorSpot.clear();cpPanel=null;cpId=null;

        sched();render();

    };
    reader.readAsText(file);
  });
  inp.click();
}

// ── Screenwriting export helpers ────────────────────────────────────────────
function stripHtml(html){
  return (html||'').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,' ')
    .replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/[ \t]+/g,' ').replace(/\n +/g,'\n').trim();
}

const hasSlugPrefix=t=>/^(INT\.|EXT\.|INT\.\/EXT\.|INT\/EXT|I\.\/E\.)/i.test((t||'').trim());

function scanBadCards(){
  return C().filter(c=>!isActHeader(c)).filter(c=>!hasSlugPrefix(c.title)).map(c=>({id:c.id,title:(c.title||'').trim()||'untitled'}));
}

function buildFountain(beatsOnly){
  const projTitle=currentFilePath?currentFilePath.split('/').pop().replace(/\.screenplaycards$/i,''):'Untitled';
  const writerLine=writer.trim()||'';
  let out='Title: '+projTitle+'\n';
  if(writerLine)out+='Author: '+writerLine+'\n';
  out+='\n===\n\n';
  C().forEach(c=>{
    if(isActHeader(c)){out+='\n# '+(c.title||'').toUpperCase()+'\n\n';return;}
    const title=(c.title||'').trim();
    if(hasSlugPrefix(title)){
      out+=title.toUpperCase()+'\n\n';
    } else {
      out+='INT. ***MISSING SCENE HEADING***\n\n';
      if(title)out+=title+'\n\n';
    }
    if(!beatsOnly){const notesRaw=stripHtml(c.notes||'');if(notesRaw)out+=notesRaw+'\n\n';}
  });
  return out;
}

function buildFDX(beatsOnly){
  const projTitle=currentFilePath?currentFilePath.split('/').pop().replace(/\.screenplaycards$/i,''):'Untitled';
  const ex=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  let content='';
  C().forEach(c=>{
    if(isActHeader(c))return; // FDX has no section concept; omit act headers
    const title=(c.title||'').trim();
    if(hasSlugPrefix(title)){
      content+='<Paragraph Type="Scene Heading"><Text>'+ex(title.toUpperCase())+'</Text></Paragraph>\n';
    } else {
      content+='<Paragraph Type="Scene Heading"><Text>INT. ***MISSING SCENE HEADING***</Text></Paragraph>\n';
      if(title)content+='<Paragraph Type="Action"><Text>'+ex(title)+'</Text></Paragraph>\n';
    }
    if(!beatsOnly){const notesRaw=stripHtml(c.notes||'');if(notesRaw)content+='<Paragraph Type="Action"><Text>'+ex(notesRaw)+'</Text></Paragraph>\n';}
  });
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    +'<FinalDraft DocumentType="Script" Template="No" Version="5">\n'
    +'<Content>\n'+content+'</Content>\n</FinalDraft>';
}

function renderExportPanel(){

    +'</div>'
    +'<div class="ep-instr-body">'

    +'<ul>'
    +'<li><strong>Card titles</strong> become scene headings. Titles must start with <code>INT.</code>, <code>EXT.</code>, or <code>INT./EXT.</code></li>'
    +'<li><strong>Card notes</strong> become action text below each scene heading.</li>'
    +'<li><strong>Act headers</strong> become section markers in Fountain (visible in Highland\u2019s navigator). In FDX they are omitted.</li>'
    +'<li>Cards without a scene heading prefix export as <code>INT. ***MISSING SCENE HEADING***</code> \u2014 easy to find and fix in your app.</li>'
    +'</ul>'
    +'</div>';
  const instrShowBtn=document.createElement('button');instrShowBtn.className='ep-instr-show';
  instrShowBtn.textContent='Show instructions';instrShowBtn.style.display=hideInstr?'':'none';
  instrShowBtn.addEventListener('click',()=>{
    localStorage.removeItem('sc-export-hide-instructions');
    instrWrap.style.display='';instrShowBtn.style.display='none';
  });
  instrWrap.querySelector('.ep-instr-dismiss').addEventListener('click',()=>{
    localStorage.setItem('sc-export-hide-instructions','1');

  // Board info

  bi.innerHTML='Exporting: <strong>'+esc(boardName)+'</strong> \u2014 '+sceneCount+' card'+(sceneCount===1?'':'s');
  panel.appendChild(bi);

  // Format picker label
  const fmtLbl=document.createElement('div');fmtLbl.className='ep-fmt-label';fmtLbl.textContent='Choose format:';panel.appendChild(fmtLbl);

  // Format cards
  const fmtRow=document.createElement('div');fmtRow.className='ep-fmt-row';

    {id:'fountain',name:'Fountain',apps:['Highland','Slugline','Fade In','WriterDuet']},
    {id:'fdx',name:'FDX',apps:['Final Draft']},
  ];

  fmtData.forEach(f=>{
    const card=document.createElement('div');
    card.className='ep-fmt-card'+(exportFmt===f.id?' ep-selected':'');
    const nm=document.createElement('div');nm.className='ep-fmt-name';nm.textContent=f.name;
    const apps=document.createElement('div');apps.className='ep-fmt-apps';
    f.apps.forEach(a=>{const s=document.createElement('span');s.textContent=a;apps.appendChild(s);});

      exportFmt=f.id;
      Object.values(fmtCardEls).forEach(c=>c.classList.remove('ep-selected'));

    });

  });

  if(badCards.length){
    const warn=document.createElement('div');warn.className='ep-warn';
    const wh=document.createElement('div');wh.className='ep-warn-hdr';
    warn.appendChild(wh);
    const wl=document.createElement('div');wl.className='ep-warn-list';

    function updateWarnCount(){
      const rem=wl.querySelectorAll('.ep-warn-item:not(.ep-warn-resolved)').length;
      if(rem===0){
        warn.className='ep-warn ep-warn-ok';
        wh.textContent='\u2713\u2002All cards now have scene heading prefixes';

        warn.className='ep-warn';

      const item=document.createElement('div');item.className='ep-warn-item';

    warn.appendChild(wn);

    panel.appendChild(warn);
  }

  // Footer
  const footer=document.createElement('div');footer.className='ep-footer';

  cancelBtn.addEventListener('click',hideExportPanel);
  footer.appendChild(exportBtn);footer.appendChild(cancelBtn);
  panel.appendChild(footer);
}

async function doExport(format){
  pendExport=null;renderSW();
  const projTitle=currentFilePath?currentFilePath.split('/').pop().replace(/\.screenplaycards$/i,''):'Untitled';
  let content,extension,filterName,defaultName;
  if(format==='fountain'){
    content=buildFountain(exportBeatsOnly);extension='fountain';filterName='Fountain Script';defaultName=projTitle+'.fountain';
  } else {
    content=buildFDX(exportBeatsOnly);extension='fdx';filterName='Final Draft Script';defaultName=projTitle+'.fdx';
  }
  if(window.electronAPI){
    await window.electronAPI.saveTextFile({content,defaultName,extension,filterName});
  }
}
